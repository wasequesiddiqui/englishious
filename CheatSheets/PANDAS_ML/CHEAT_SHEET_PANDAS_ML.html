<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📘 Data Science Interactive Cheatsheet</title>
    <style>
        :root {
            --bg: #ffffff;
            --card-bg: #fafaf8;
            --text: #2e2e2e;
            --border: #d8d5cc;
            --accent: #b45f4b;      /* terracotta accent */
            --accent-hover: #9e4f3e;
            --code-bg: #ece7dc;     /* olive‑green pastel tint */
            --shadow: 0 2px 8px rgba(0,0,0,0.05);
            --summary-bg: #f4f0e6;  /* warm cream */
            --th-text: #ffffff;
            /* camel for alternating rows */
            --row-even-bg: #d9b68a; /* camel */
            --row-odd-bg: #ffffff;
            --row-hover: #f2e2cf;
        }
        body.dark {
            --bg: #1e1e2f;
            --card-bg: #2a2a3c;
            --text: #e0d7c6;
            --border: #4a4940;
            --accent: #d48c6b;
            --accent-hover: #c07a5a;
            --code-bg: #3a382c;       /* dark olive tint */
            --shadow: 0 2px 10px rgba(0,0,0,0.4);
            --summary-bg: #332f2a;
            --th-text: #ffffff;
            --row-even-bg: #4a3f32;   /* dark camel */
            --row-odd-bg: #2a2a3c;
            --row-hover: #554b3e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            padding: 1.5rem;
            max-width: 1300px;
            margin: 0 auto;
            line-height: 1.5;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
        }
        #searchInput {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 2rem;
            background: var(--card-bg);
            color: var(--text);
            width: 220px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        #searchInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(180,95,75,0.2);
        }
        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s;
            white-space: nowrap;
            text-decoration: none;
        }
        .btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 1.5rem;
            padding-bottom: 0.3rem;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text);
            border-radius: 0.4rem 0.4rem 0 0;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            background: var(--summary-bg);
        }
        .tab-btn.active {
            color: var(--accent);
            font-weight: 600;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-bottom: 2px solid var(--bg);
            margin-bottom: -2px;
        }
        body.dark .tab-btn.active {
            border-bottom-color: var(--bg);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section {
            margin-bottom: 1.2rem;
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            background: var(--card-bg);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: all 0.2s;
        }
        .section summary {
            padding: 0.9rem 1.2rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--summary-bg);
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .section summary::-webkit-details-marker {
            display: none;
        }
        .section summary::after {
            content: '▸';
            font-size: 1.2rem;
            transition: transform 0.2s;
            margin-left: 0.5rem;
        }
        .section[open] summary::after {
            transform: rotate(90deg);
        }
        .section .content {
            padding: 0.8rem 1.2rem 1.2rem;
        }

        /* ── Pastel Earthy Tables ── */
        .function-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .function-table th {
            font-weight: 600;
            padding: 0.6rem 0.7rem;
            text-align: left;
            border: 1px solid var(--border);
            transition: background 0.2s;
            color: var(--th-text);
        }
        .function-table td {
            padding: 0.5rem 0.7rem;
            border: 1px solid var(--border);
            vertical-align: top;
            transition: background 0.15s;
        }
        /* alternating row camel theme */
        .function-table tbody tr:nth-child(odd) td {
            background: var(--row-odd-bg);
        }
        .function-table tbody tr:nth-child(even) td {
            background: var(--row-even-bg);
        }
        .function-table tbody tr:hover td {
            background: var(--row-hover);
            cursor: default;
        }
        .function-table code {
            background: var(--code-bg);
            padding: 0.15rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.82rem;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .desc-text {
            color: var(--text);
            opacity: 0.9;
            line-height: 1.5;
        }
        .no-results {
            text-align: center;
            padding: 2rem;
            opacity: 0.6;
        }

        /* Per‑tab header colors (light & dark) */
        #tabContentContainer[data-tab="pandas"] .function-table th {
            background: #e27a5f; /* Terracotta */
        }
        body.dark #tabContentContainer[data-tab="pandas"] .function-table th {
            background: #b25b4b;
        }
        #tabContentContainer[data-tab="numpy"] .function-table th {
            background: #f4a261; /* Burnt Orange */
        }
        body.dark #tabContentContainer[data-tab="numpy"] .function-table th {
            background: #cc8533;
        }
        #tabContentContainer[data-tab="matplotlib"] .function-table th {
            background: #f2c94c; /* Mustard Yellow */
            color: #2e2e2e;       /* dark text for contrast */
        }
        body.dark #tabContentContainer[data-tab="matplotlib"] .function-table th {
            background: #d4ac0d;
            color: #ffffff;
        }
        #tabContentContainer[data-tab="plotly"] .function-table th {
            background: #9caf88; /* Sage Green */
        }
        body.dark #tabContentContainer[data-tab="plotly"] .function-table th {
            background: #7a8b5f;
        }
        #tabContentContainer[data-tab="sklearn"] .function-table th {
            background: #4f9da6; /* Deep Teal */
        }
        body.dark #tabContentContainer[data-tab="sklearn"] .function-table th {
            background: #3b7b7b;
        }

        /* ── Export container (hidden except when printing) ── */
        #exportContainer {
            display: none;
            background: white;
            color: black;
            padding: 0.5cm;
            font-family: system-ui, sans-serif;
        }
        /* Export tab-specific table header colors */
        .export-tab.tab-pandas .function-table th {
            background: #e27a5f !important;
            color: #fff !important;
        }
        .export-tab.tab-numpy .function-table th {
            background: #f4a261 !important;
            color: #fff !important;
        }
        .export-tab.tab-matplotlib .function-table th {
            background: #f2c94c !important;
            color: #2e2e2e !important;
        }
        .export-tab.tab-plotly .function-table th {
            background: #9caf88 !important;
            color: #fff !important;
        }
        .export-tab.tab-sklearn .function-table th {
            background: #4f9da6 !important;
            color: #fff !important;
        }
        /* Export alternating rows camel (print) */
        #exportContainer .function-table tbody tr:nth-child(even) td {
            background: #d9b68a !important;
        }
        #exportContainer .function-table tbody tr:nth-child(odd) td {
            background: #ffffff !important;
        }
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            body > *:not(#exportContainer) {
                display: none !important;
            }
            #exportContainer {
                display: block !important;
                position: static;
                margin: 0;
                padding: 0.5cm;
            }
            #exportContainer .section {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ccc;
                background: white;
                margin-bottom: 0.8rem;
            }
            #exportContainer .section summary {
                background: #f0f0f0;
                color: black;
            }
            #exportContainer .tab-title {
                font-size: 1.4rem;
                font-weight: bold;
                margin-top: 1rem;
                margin-bottom: 0.6rem;
                border-bottom: 2px solid #333;
                padding-bottom: 0.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>📊 Data Science Cheatsheet</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search functions..." autocomplete="off">
            <button id="themeToggle" class="btn">🌙 Dark</button>
            <button id="exportPdfBtn" class="btn">📄 Export / Print PDF</button>
        </div>
    </header>

    <div class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="pandas">🐼 Pandas</button>
        <button class="tab-btn" data-tab="numpy">🔢 NumPy</button>
        <button class="tab-btn" data-tab="matplotlib">📈 Matplotlib</button>
        <button class="tab-btn" data-tab="plotly">📉 Plotly</button>
        <button class="tab-btn" data-tab="sklearn">🤖 Scikit‑learn</button>
    </div>

    <div id="tabContentContainer"></div>
    <div id="exportContainer"></div>

    <script>

                sklearn: {

                        {

                            items: [

                                { syntax: "pca.fit_transform(X)", desc: "Fit PCA and transform.", use: "Reduce to 2D for plotting." }
                            ]
                        },
                        {
                            title: "Metrics & Evaluation",
                            items: [
                                { syntax: "accuracy_score(y_true, y_pred)", desc: "Fraction correct.", use: "Basic classification metric." },
                                { syntax: "classification_report(y_true, y_pred)", desc: "Precision, recall, f1 per class.", use: "Detailed class‑wise report." },

                            ]
                        },
                        {
                            title: "Pipelines",
                            items: [
                                { syntax: "make_pipeline(StandardScaler(), LogisticRegression())", desc: "Chain preprocessing & model.", use: "Avoid data leakage, simplify code." },
                                { syntax: "pipe.fit(X_train, y_train)", desc: "Train entire pipeline.", use: "One‑step training." },
                                { syntax: "pipe.score(X_test, y_test)", desc: "Evaluate pipeline.", use: "Default scoring metric." }

            };

            const tabContainer = document.getElementById('tabContentContainer');
            const exportContainer = document.getElementById('exportContainer');
            const tabNav = document.getElementById('tabNav');
            const searchInput = document.getElementById('searchInput');
            const themeToggle = document.getElementById('themeToggle');
            const exportBtn = document.getElementById('exportPdfBtn');

            let activeTab = 'pandas';

            function renderItemsTable(items) {
                if (!items || items.length === 0) return '';
                let html = `<table class="function-table">
                    <thead><tr><th>Syntax</th><th>What it does</th><th>When to use</th></tr></thead><tbody>`;
                items.forEach(item => {
                    html += `<tr>
                        <td><code>${escapeHtml(item.syntax)}</code></td>
                        <td class="desc-text">${escapeHtml(item.desc)}</td>
                        <td class="desc-text">${escapeHtml(item.use)}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                return html;
            }

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function renderTab(tabKey, filterText = '') {
                const data = cheatsheetData[tabKey];
                if (!data) return;
                const filterLower = filterText.toLowerCase();
                let html = '';
                let anyVisible = false;

                data.sections.forEach(section => {
                    const title = section.title;
                    let filteredItems = section.items;
                    if (filterLower) {
                        filteredItems = section.items.filter(item =>
                            item.syntax.toLowerCase().includes(filterLower) ||
                            item.desc.toLowerCase().includes(filterLower) ||
                            item.use.toLowerCase().includes(filterLower)
                        );
                    }
                    const titleMatch = !filterLower || title.toLowerCase().includes(filterLower);
                    if (!titleMatch && filteredItems.length === 0) return;

                    anyVisible = true;
                    const tableHtml = renderItemsTable(filteredItems);
                    html += `
                        <details class="section" ${filterLower ? 'open' : ''}>
                            <summary>${escapeHtml(title)}</summary>
                            <div class="content">${tableHtml || '<p class="desc-text">No matching items.</p>'}</div>
                        </details>
                    `;
                });

                if (!anyVisible) {
                    html = `<div class="no-results">🔍 No results for "<strong>${escapeHtml(filterText)}</strong>" in ${data.title}</div>`;
                }

                tabContainer.innerHTML = html;
                // Update data-tab attribute for CSS styling
                tabContainer.setAttribute('data-tab', tabKey);
            }

            function switchTab(tabKey) {
                activeTab = tabKey;
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tabKey);
                });
                renderTab(tabKey, searchInput.value);
            }

            function buildExportHTML() {
                let html = '';
                for (const [key, data] of Object.entries(cheatsheetData)) {
                    html += `<div class="export-tab tab-${key}">`;
                    html += `<div class="tab-title">${escapeHtml(data.title)}</div>`;
                    data.sections.forEach(section => {
                        html += `<details class="section" open>
                            <summary>${escapeHtml(section.title)}</summary>
                            <div class="content">${renderItemsTable(section.items)}</div>
                        </details>`;
                    });
                    html += `</div>`;
                }
                return html;
            }

            exportBtn.addEventListener('click', () => {
                exportContainer.innerHTML = buildExportHTML();
                window.print();
            });

            searchInput.addEventListener('input', (e) => {
                renderTab(activeTab, e.target.value);
            });

            tabNav.addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;
                switchTab(btn.dataset.tab);
            });

            function updateThemeIcon() {
                const isDark = document.body.classList.contains('dark');
                themeToggle.innerHTML = isDark ? '☀️ Light' : '🌙 Dark';
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark');
                updateThemeIcon();
                localStorage.setItem('cheatsheetTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
            });
            if (localStorage.getItem('cheatsheetTheme') === 'dark') {
                document.body.classList.add('dark');
            }
            updateThemeIcon();

            // initial load
            switchTab('pandas');
        })();
    </script>
