<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Log: React App → GitHub Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF3F8;
    --bg-grid: rgba(44,95,138,0.07);
    --paper: #FFFFFF;
    --ink: #16324F;
    --ink-soft: #4B6579;
    --accent: #2C5F8A;
    --accent-strong: #123C5C;
    --warn: #C98A2C;
    --warn-bg: #FCF3E3;
    --success: #2E7D53;
    --success-bg: #E8F5EC;
    --code-bg: #0F2A3F;
    --code-text: #D7E6F2;
    --code-key: #7FB2DE;
    --border: #C3D3E0;
    --border-soft: #D9E4EC;
    --radius: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  header.masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    border-bottom: 2px solid var(--accent-strong);
    padding-bottom: 18px;
    margin-bottom: 26px;
  }
  .title-block h1{
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size: clamp(1.5rem, 3vw, 2.1rem);
    margin: 0 0 6px;
    color: var(--accent-strong);
    letter-spacing: -0.01em;
  }
  .title-block p{
    margin:0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
  .sheet-meta{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.75rem;
    text-align:right;
    color: var(--ink-soft);
    line-height:1.5;
    border: 1px solid var(--border);
    background: var(--paper);
    padding: 8px 12px;
    border-radius: var(--radius);
  }
  .sheet-meta strong{ color: var(--accent-strong); }

  .meter-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 28px;
  }
  .meter-track{
    flex:1;
    height: 10px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    transition: width 0.4s ease;
  }
  .meter-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight:600;
    color: var(--accent-strong);
    white-space:nowrap;
    min-width: 92px;
    text-align:right;
  }

  .layout{
    display:grid;
    grid-template-columns: 260px 1fr;
    gap: 22px;
    align-items:start;
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
    nav.toc{ position: static !important; }
  }

  nav.toc{
    position: sticky;
    top: 20px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px;
  }
  nav.toc button{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background: none;
    border: none;
    padding: 10px 10px;
    border-radius: 4px;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 0.87rem;
    color: var(--ink-soft);
    border-left: 3px solid transparent;
  }
  nav.toc button:hover{ background: var(--bg); }
  nav.toc button.active{
    background: var(--bg);
    color: var(--accent-strong);
    font-weight:600;
    border-left: 3px solid var(--accent);
  }
  nav.toc .tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
    min-width: 44px;
  }
  nav.toc .check{
    width: 15px; height:15px;
    border-radius:3px;
    border: 1.5px solid var(--border);
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size: 10px;
    color: white;
  }
  nav.toc .check.done{
    background: var(--success);
    border-color: var(--success);
  }

  main.panel{
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px 34px;
    min-height: 400px;
  }
  .step-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 6px;
  }
  .step-title{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 1.5rem;
    margin: 0 0 18px;
    color: var(--accent-strong);
  }
  .panel h3{
    font-family:'JetBrains Mono', monospace;
    color: var(--accent-strong);
    font-size: 1.05rem;
    margin: 26px 0 10px;
  }
  .panel p{ line-height:1.65; margin: 0 0 14px; }
  .panel ul, .panel ol{ line-height:1.7; padding-left: 22px; margin: 0 0 14px;}
  .panel table{ width:100%; border-collapse: collapse; margin: 10px 0 18px; font-size:0.9rem;}
  .panel th, .panel td{ border: 1px solid var(--border-soft); padding: 8px 10px; text-align:left; vertical-align:top;}
  .panel th{ background: var(--bg); font-family:'JetBrains Mono', monospace; font-size:0.78rem; }

  .callout{
    border-radius: var(--radius);
    padding: 12px 16px;
    margin: 16px 0;
    font-size: 0.9rem;
    line-height:1.6;
  }
  .callout.note{ background: var(--warn-bg); border: 1px solid #EAD2A3; color:#7A5411; }
  .callout.note strong{ color:#7A5411; }

  .code-block{
    position:relative;
    margin: 14px 0 18px;
  }
  .code-block pre{
    background: var(--code-bg);
    color: var(--code-text);
    padding: 16px 44px 16px 16px;
    border-radius: var(--radius);
    overflow-x:auto;
    font-family:'JetBrains Mono', monospace;
    font-size: 0.84rem;
    line-height:1.6;
    margin:0;
  }
  .code-block .copy-btn{
    position:absolute;
    top:8px; right:8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--code-text);
    font-family:'JetBrains Mono', monospace;
    font-size: 0.68rem;
    padding: 4px 8px;
    border-radius: 4px;
    cursor:pointer;
  }
  .code-block .copy-btn:hover{ background: rgba(255,255,255,0.18); }
  .code-block .copy-btn.copied{ background: var(--success); border-color: var(--success); color:white; }
  code.inline{
    font-family:'JetBrains Mono', monospace;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.88em;
  }

  .checklist-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border-soft);
  }
  .checklist-item:last-child{ border-bottom:none; }
  .checklist-item input{ margin-top: 4px; width:16px; height:16px; accent-color: var(--success); flex-shrink:0;}
  .checklist-item label{ line-height:1.55; }

  .nav-buttons{
    display:flex;
    justify-content:space-between;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border-soft);
  }
  .nav-buttons button{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight:600;
    padding: 10px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--accent);
    background: var(--paper);
    color: var(--accent-strong);
    cursor:pointer;
  }
  .nav-buttons button.primary{
    background: var(--accent-strong);
    color: white;
    border-color: var(--accent-strong);
  }
  .nav-buttons button:disabled{
    opacity: 0.35;
    cursor: not-allowed;
  }
  .nav-buttons button:hover:not(:disabled){ filter: brightness(1.05); }

  .done-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--success);
    background: var(--success-bg);
    border: 1px solid #BFE2CC;
    padding: 4px 10px;
    border-radius: 999px;
    margin-left: 12px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="title-block">
      <h1>BUILD LOG — REACT → GITHUB PAGES</h1>
      <p>A step-by-step deployment record. Check off each stage as you complete it.</p>
    </div>
    <div class="sheet-meta">

  </div>

  <div class="layout">
    <nav class="toc" id="toc"></nav>
    <main class="panel" id="panel"></main>
  </div>
</div>

<script>

    <p>Before touching anything, here's what each tool actually does:</p>
    <ul>

  checklist: ["git --version prints a version number"]

{
  tag: "SHT-04",
  title: "Create a GitHub account",
  eyebrow: "Prerequisites · 4 of 6",
  body: `
    <p>Go to <code class="inline">https://github.com</code> and sign up if you don't already have an account. Remember your username — you'll need it later.</p>
  `,
  checklist: ["I have a GitHub account and know my username"]

  tag: "SHT-05",

  body: `
    <p>One-time setup. Replace the name and email with your own (use the same email as your GitHub account):</p>

  tag: "SHT-06",

  body: `
    <p>Install <strong>GitHub CLI</strong>: <code class="inline">https://cli.github.com</code>, then run:</p>
    <div class="code-block"><pre data-code="gh auth login">gh auth login</pre><button class="copy-btn">Copy</button></div>
    <p>Follow the prompts: GitHub.com → HTTPS → login with a web browser. This saves you from typing passwords later.</p>
    <div class="callout note"><strong>Feeling lost?</strong> Skip this for now — there's a browser-based login fallback when you push code later.</div>
  `,
  checklist: ["I ran gh auth login, or I'm deliberately skipping it"]
},
{
  tag: "SHT-07",
  title: "Create the React project",
  eyebrow: "Build · project setup",
  body: `
    <h3>Pick a folder</h3>
    <div class="code-block"><pre data-code="cd ~
mkdir Projects
cd Projects">cd ~
mkdir Projects
cd Projects</pre><button class="copy-btn">Copy</button></div>
    <p><code class="inline">cd ~</code> moves into your home folder, <code class="inline">mkdir Projects</code> creates a new folder, <code class="inline">cd Projects</code> moves into it.</p>

    <h3>Generate the project with Vite</h3>
    <div class="code-block"><pre data-code="npm create vite@latest my-data-app -- --template react">npm create vite@latest my-data-app -- --template react</pre><button class="copy-btn">Copy</button></div>

    <p>Open the printed URL (usually <code class="inline">http://localhost:5173</code>) in your browser. You should see the default Vite starter page. <strong>Leave this terminal running</strong> — it auto-refreshes on save. Open a new terminal tab for other commands.</p>

    <h3>Open it in VS Code</h3>
    <div class="code-block"><pre data-code="code .">code .</pre><button class="copy-btn">Copy</button></div>

    <h3>Project structure</h3>
    <table>

      <tr><td>node_modules/</td><td>downloaded libraries — never edit</td></tr>

      <tr><td>package.json</td><td>project settings and command shortcuts</td></tr>

    &lt;/div&gt;

}

export default App;'>function App() {

  );
}

export default App;</pre><button class="copy-btn">Copy</button></div>

  `,

    "npm run dev works and shows the starter page",

{
  tag: "SHT-08",
  title: "Build the data app",
  eyebrow: "Build · the actual app",
  body: `
    <p>Replace the contents of <code class="inline">src/App.jsx</code> again with:</p>
    <div class="code-block"><pre data-code='import { useEffect, useState } from "react";

function App() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() =&gt; {
    fetch("https://jsonplaceholder.typicode.com/users")

      &lt;/ul&gt;
    &lt;/div&gt;
  );
}

export default App;'>import { useEffect, useState } from "react";

function App() {

  const [loading, setLoading] = useState(true);

  useEffect(() =&gt; {
    fetch("https://jsonplaceholder.typicode.com/users")
      .then((res) =&gt; res.json())
      .then((data) =&gt; {
        setUsers(data);
        setLoading(false);
      });
  }, []);

  if (loading) return &lt;p&gt;Loading...&lt;/p&gt;;

  return (
    &lt;div style={{ padding: "2rem", fontFamily: "sans-serif" }}&gt;
      &lt;h1&gt;User Directory&lt;/h1&gt;
      &lt;ul&gt;
        {users.map((user) =&gt; (
          &lt;li key={user.id}&gt;

    &lt;/div&gt;

}

export default App;</pre><button class="copy-btn">Copy</button></div>
    <h3>What this code does, in plain English</h3>
    <ul>
      <li><code class="inline">useState([])</code> creates a variable <code class="inline">users</code> starting empty, plus <code class="inline">setUsers</code> to update it.</li>

    <div class="code-block"><pre data-code="git remote add origin https://github.com/YOUR-USERNAME/my-data-app.git">git remote add origin https://github.com/YOUR-USERNAME/my-data-app.git</pre><button class="copy-btn">Copy</button></div>

let current = 0;
const completed = new Set();
const toc = document.getElementById('toc');
const panel = document.getElementById('panel');
const meterFill = document.getElementById('meterFill');
const meterLabel = document.getElementById('meterLabel');

function totalChecklistItems(){
  return steps.reduce((sum, s) => sum + s.checklist.length, 0);
}
function completedChecklistItems(){
  return completed.size;
}
function updateMeter(){
  const total = totalChecklistItems();
  const done = completedChecklistItems();
  const pct = total ? Math.round((done/total)*100) : 0;
  meterFill.style.width = pct + '%';
  meterLabel.textContent = done + ' / ' + total + ' done';
}

function stepAllDone(stepIdx){
  const s = steps[stepIdx];
  return s.checklist.every((_, i) => completed.has(stepIdx + '-' + i));
}

function renderToc(){
  toc.innerHTML = '';
  steps.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = i === current ? 'active' : '';
    const check = document.createElement('span');
    check.className = 'check' + (stepAllDone(i) ? ' done' : '');
    check.textContent = stepAllDone(i) ? '✓' : '';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = s.tag;
    const label = document.createElement('span');
    label.textContent = s.title;
    btn.appendChild(check);
    btn.appendChild(tag);
    btn.appendChild(label);
    btn.onclick = () => { current = i; render(); };
    toc.appendChild(btn);
  });
}

function renderPanel(){
  const s = steps[current];
  const allDone = stepAllDone(current);
  panel.innerHTML = `
    <p class="step-eyebrow">${s.eyebrow}</p>
    <h2 class="step-title">${s.tag} — ${s.title}${allDone ? '<span class="done-badge">✓ complete</span>' : ''}</h2>
    <div class="step-body">${s.body}</div>
    <h3>Mark your progress</h3>
    <div class="checklist">
      ${s.checklist.map((item, i) => {
        const id = current + '-' + i;
        const checked = completed.has(id) ? 'checked' : '';
        return `<div class="checklist-item">
          <input type="checkbox" id="chk-${id}" data-id="${id}" ${checked}>
          <label for="chk-${id}">${item}</label>
        </div>`;
      }).join('')}
    </div>
    <div class="nav-buttons">
      <button id="prevBtn" ${current === 0 ? 'disabled' : ''}>&larr; Previous</button>
      <button id="nextBtn" class="primary" ${current === steps.length - 1 ? 'disabled' : ''}>Next &rarr;</button>
    </div>
  `;

  panel.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const id = e.target.getAttribute('data-id');
      if (e.target.checked) completed.add(id); else completed.delete(id);
      updateMeter();
      renderToc();
      const badgeSpot = panel.querySelector('.step-title');
      if (stepAllDone(current) && !badgeSpot.querySelector('.done-badge')) {
        badgeSpot.innerHTML = `${s.tag} — ${s.title}<span class="done-badge">✓ complete</span>`;
      } else if (!stepAllDone(current)) {
        badgeSpot.innerHTML = `${s.tag} — ${s.title}`;
      }
    });
  });

  panel.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const codeEl = btn.previousElementSibling;
      const text = codeEl.getAttribute('data-code') || codeEl.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
      });
    });
  });

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevBtn) prevBtn.onclick = () => { if (current > 0) { current--; render(); window.scrollTo({top:0, behavior:'smooth'}); } };
  if (nextBtn) nextBtn.onclick = () => { if (current < steps.length - 1) { current++; render(); window.scrollTo({top:0, behavior:'smooth'}); } };
}

function render(){
  renderToc();
  renderPanel();
  updateMeter();
}

render();
</script>
